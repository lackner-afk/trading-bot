# /etc/nginx/sites-available/bot.silvertoast.at
# Danach: sudo ln -s ../sites-available/bot.silvertoast.at /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d bot.silvertoast.at
# Das Passwort prüft das Dashboard selbst (Basic-Auth), nginx reicht nur durch.
server {
    listen 80;
    listen [::]:80;
    server_name bot.silvertoast.at;

    # Keine Suchmaschinen, kein Einbetten in fremde Seiten
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
